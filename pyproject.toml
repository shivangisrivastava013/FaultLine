[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
description = "FaultLine: ML Observability, Incident Detection, Root-Cause Investigation & Recovery System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "prometheus-client>=0.17.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.6",
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "mlflow>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
